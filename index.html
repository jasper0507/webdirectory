<!doctype html>
<html lang="zh-CN" data-paper="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef0f2" />
    <title>七卷拾光</title>
    <meta name="description" content="维护者的公开书签目录。键入一个名字，让收藏顺流而下。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var storedPaper = localStorage.getItem('portal-paper')
        document.documentElement.dataset.paper = storedPaper === 'night' ? 'night' : 'day'
        document.documentElement.style.colorScheme = storedPaper === 'night' ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.paper = 'day'
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <a class="skip-link" href="#q">跳到提问</a>

    <div id="view-hall" class="page hall">
      <header class="site-header">
        <button class="brand" type="button" data-home aria-label="回到拾光">
          <img src="/favicon.svg" alt="" width="28" height="28" />
          <span class="brand-name" data-wordmark>七卷拾光</span>
        </button>
        <div class="nav-meta">
          <span class="gold-dot"></span>
          <span class="nav-en" data-stamp-en>SEVEN SHELVES</span>
          <span data-convergence>七卷同归</span>
        </div>
      </header>

      <main class="site-main">
        <div class="orbit" aria-hidden="true"></div>
        <div class="hero">
          <div class="overline">
            <span class="overline-line"></span>
            <span data-eyebrow>BIBLIOTHECA</span>
            <span class="overline-line"></span>
          </div>
          <h1 class="title" data-monument-label aria-label="拾光">
            <span class="reveal-line" data-monument-0>拾</span><span class="reveal-line" data-monument-1>光</span>
          </h1>
          <p class="tagline" data-whisper>在七座私人书架之间，键入一个名字，
让收藏顺流而下。</p>
        </div>

        <form class="search-block" id="search-form" action="/shelf" method="get" autocomplete="off">
          <div class="search-row">
            <label class="sr-only" for="q">键入书签或站点</label>
            <input
              class="search-input"
              id="q"
              type="text"
              name="q"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="hall-list"
              aria-expanded="false"
              aria-haspopup="listbox"
              placeholder="键入书签或站点..."
              autocomplete="off"
              spellcheck="false"
            />
            <button class="search-btn" type="submit" aria-label="检索书签">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
            </button>
            <span class="grow-line"></span>
          </div>
          <div class="hints">
            <span><kbd>/</kbd>聚焦检索</span>
            <span><kbd>↵</kbd>打开选中，或进入货架</span>
          </div>
          <div id="hall-list" class="hall-list" role="listbox" aria-label="题名索引" hidden></div>
        </form>

        <div id="seven-words" class="chips" role="list"></div>
      </main>

      <footer class="site-footer">
        <div class="hairline"></div>
        <p class="footer-row">
          <span class="truncate" data-colophon-left>SHELVED FROM SEVEN ARCHIVES</span>
          <span class="footer-right">
            <button class="paper-toggle" type="button" data-paper-toggle>夜间</button>
            <span data-colophon-right>SEVEN SHELVES · ONE STREAM</span>
          </span>
        </p>
      </footer>
    </div>

    <div id="view-shelf" class="page shelf" hidden>
      <header class="shelf-header">
        <button class="brand" type="button" data-home aria-label="回到拾光">
          <img src="/favicon.svg" alt="" width="28" height="28" />
          <span class="brand-name" data-wordmark>七卷拾光</span>
        </button>
        <p class="shelf-count" id="shelf-count">0 个站点</p>
      </header>

      <form class="search-block shelf-search" id="shelf-form" action="/shelf" method="get" role="search" autocomplete="off">
        <div class="search-row">
          <label class="sr-only" for="shelf-q">在货架上继续提问</label>
          <input
            id="shelf-q"
            class="search-input"
            type="text"
            name="q"
            placeholder="键入书签或站点..."
            autocomplete="off"
            spellcheck="false"
          />
          <button class="search-btn" type="submit" aria-label="检索书签">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
          </button>
        </div>
      </form>

      <div id="constraints" class="constraints"></div>
      <div id="cooccur" class="cooccur"></div>
      <p id="shelf-status" class="result-status" aria-live="polite" aria-atomic="true"></p>
      <main id="shelf-results" class="results"></main>

      <footer class="site-footer">
        <div class="hairline"></div>
        <p class="footer-row">
          <span class="truncate" data-colophon-left>SHELVED FROM SEVEN ARCHIVES</span>
          <span class="footer-right">
            <button class="paper-toggle" type="button" data-paper-toggle>夜间</button>
            <span data-colophon-right>SEVEN SHELVES · ONE STREAM</span>
          </span>
        </p>
      </footer>
    </div>

    <p id="live-note" class="sr-only" aria-live="polite"></p>

    <template id="card-template">
      <article class="bookmark-card">
        <a class="card-main" target="_blank" rel="noopener noreferrer">
          <h2 class="card-title"></h2>
          <p class="card-desc" hidden></p>
          <p class="card-url"></p>
        </a>
        <div class="card-tags"></div>
      </article>
    </template>

    <template id="state-load-error">
      <div class="state-panel" role="alert">
        <h2>无法加载门户源</h2>
        <p data-error-detail>读不到配置文件。</p>
        <button type="button" class="text-action" data-retry>重新加载</button>
      </div>
    </template>

    <template id="state-empty-catalog">
      <div class="state-panel">
        <h2>书签源还是空的</h2>
        <p>维护者写入门户源并发布后，这里会出现可搜索的资源站。</p>
      </div>
    </template>

    <template id="state-empty-filter">
      <div class="state-panel">
        <h2>没有匹配的书签</h2>
        <p>试试更短的词，或去掉标签约束。</p>
        <button type="button" class="text-action" data-clear-filters>清除约束</button>
      </div>
    </template>
  </body>
</html>
